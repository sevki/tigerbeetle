openapi: 3.1.0
info:
  title: TigerBeetle WASM Worker
  version: "0.1.0"
  description: >-
    HTTP API for one TigerBeetleLedger Durable Object (src/index.mjs), running the production
    TigerBeetle state machine compiled to WASM (src/wasm/tb_wasm.zig). All u128/u64 values
    (account/transfer ids, amounts) are transported as decimal strings, since JSON numbers can't
    represent the full range. See README.md for what this is and isn't.

servers:
  - url: http://127.0.0.1:9876
    description: celld dev (npm run dev)
  - url: http://127.0.0.1:8787
    description: wrangler dev (npm run dev:workerd)

paths:
  /ledger/{ledgerId}/accounts:
    post:
      operationId: createAccounts
      summary: Create one or more accounts.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AccountCreate"
      responses:
        "200":
          description: One CreateResult per submitted account, same order as the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreateResult"
        "400":
          $ref: "#/components/responses/Error"

  /ledger/{ledgerId}/transfers:
    post:
      operationId: createTransfers
      summary: Create one or more transfers.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TransferCreate"
      responses:
        "200":
          description: One CreateResult per submitted transfer, same order as the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreateResult"
        "400":
          $ref: "#/components/responses/Error"

  /ledger/{ledgerId}/lookup_accounts:
    post:
      operationId: lookupAccounts
      summary: Look up accounts by id.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The accounts that exist, in lookup order (missing ids are omitted).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"

  /ledger/{ledgerId}/lookup_transfers:
    post:
      operationId: lookupTransfers
      summary: Look up transfers by id.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The transfers that exist, in lookup order (missing ids are omitted).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/Error"

  /ledger/{ledgerId}/codes:
    get:
      operationId: listCodes
      summary: List every registered (ledger, code) meaning for this ledgerId.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      responses:
        "200":
          description: All registered codes, ordered by (ledger, code).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Code"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: upsertCodes
      summary: Register or update what one or more (ledger, code) pairs mean.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CodeUpsert"
      responses:
        "200":
          description: The full updated registry, same shape as GET /codes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Code"
        "400":
          $ref: "#/components/responses/Error"

components:
  parameters:
    LedgerId:
      name: ledgerId
      in: path
      required: true
      description: >-
        Names the Durable Object instance (one in-memory TigerBeetle ledger per distinct
        ledgerId). Not a TigerBeetle `ledger` field/account grouping.
      schema:
        type: string

  responses:
    Error:
      description: The request was rejected before reaching the state machine (e.g. bad JSON).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    Id:
      description: A u128 id, as a decimal string.
      type: string
      pattern: "^[0-9]+$"

    U128:
      description: A u128 value, as a decimal string.
      type: string
      pattern: "^[0-9]+$"

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AccountCreate:
      type: object
      required: [id, ledger, code]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        ledger:
          type: integer
          minimum: 0
          maximum: 4294967295
        code:
          type: integer
          minimum: 1
          maximum: 65535
        flags:
          description: Bitwise-OR of AccountFlags (see src/tigerbeetle.zig).
          type: integer
          minimum: 0
          maximum: 65535
          default: 0
        user_data_128: { $ref: "#/components/schemas/U128" }
        user_data_64:
          description: u64, as a decimal string.
          type: string
          pattern: "^[0-9]+$"
        user_data_32:
          type: integer
        name:
          description: >-
            Human-readable label. Not a TigerBeetle field -- stored separately in this DO's own
            SQLite storage, keyed by account id, scoped to this ledgerId.
          type: string

    Code:
      description: >-
        What one (ledger, code) pair means -- a currency, or a non-monetary unit (compute,
        storage, ...). Scoped to one ledgerId's own SQLite storage; not global.
      type: object
      required: [ledger, code, kind, symbol, name, decimals]
      properties:
        ledger:
          description: TigerBeetle's `ledger` field, not the `<ledgerId>` path segment.
          type: integer
          minimum: 0
          maximum: 4294967295
        code:
          type: integer
          minimum: 1
          maximum: 65535
        kind:
          description: Freeform, not validated, e.g. "currency", "compute", "storage".
          type: string
        symbol:
          description: e.g. "$", "vCPU-hr".
          type: string
        name:
          description: e.g. "US Dollar".
          type: string
        decimals:
          description: How many of the smallest unit make one display unit (e.g. 2 for cents).
          type: integer
          minimum: 0

    CurrencyInfo:
      description: >-
        A Code's metadata without the (ledger, code) pair itself -- embedded in Account/Transfer
        responses, where ledger/code are already present on the enclosing object.
      type: object
      required: [kind, symbol, name, decimals]
      properties:
        kind:
          description: Freeform, not validated, e.g. "currency", "compute", "storage".
          type: string
        symbol:
          description: e.g. "$", "vCPU-hr".
          type: string
        name:
          description: e.g. "US Dollar".
          type: string
        decimals:
          description: How many of the smallest unit make one display unit (e.g. 2 for cents).
          type: integer
          minimum: 0

    CodeUpsert:
      description: Same fields as Code, but `decimals` is optional (defaults to 0).
      type: object
      required: [ledger, code, kind, symbol, name]
      properties:
        ledger:
          description: TigerBeetle's `ledger` field, not the `<ledgerId>` path segment.
          type: integer
          minimum: 0
          maximum: 4294967295
        code:
          type: integer
          minimum: 1
          maximum: 65535
        kind:
          description: Freeform, not validated, e.g. "currency", "compute", "storage".
          type: string
        symbol:
          description: e.g. "$", "vCPU-hr".
          type: string
        name:
          description: e.g. "US Dollar".
          type: string
        decimals:
          description: How many of the smallest unit make one display unit (e.g. 2 for cents).
          type: integer
          minimum: 0

    TransferCreate:
      type: object
      required: [id, debit_account_id, credit_account_id, amount, ledger, code]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        debit_account_id: { $ref: "#/components/schemas/Id" }
        credit_account_id: { $ref: "#/components/schemas/Id" }
        amount: { $ref: "#/components/schemas/U128" }
        pending_id: { $ref: "#/components/schemas/Id" }
        ledger:
          type: integer
          minimum: 0
          maximum: 4294967295
        code:
          type: integer
          minimum: 1
          maximum: 65535
        timeout:
          description: Seconds; only meaningful with the `pending` flag.
          type: integer
          minimum: 0
        flags:
          description: Bitwise-OR of TransferFlags (see src/tigerbeetle.zig).
          type: integer
          minimum: 0
          maximum: 65535
          default: 0
        user_data_128: { $ref: "#/components/schemas/U128" }
        user_data_64:
          description: u64, as a decimal string.
          type: string
          pattern: "^[0-9]+$"
        user_data_32:
          type: integer

    CreateResult:
      description: >-
        One per submitted event, same order as the request. `status` is CreateAccountStatus or
        CreateTransferStatus (src/tigerbeetle.zig): 4294967295 (u32 max) means the event was
        applied; any other value names the rejection reason.
      type: object
      required: [timestamp, status]
      properties:
        timestamp:
          description: u64 nanoseconds, as a decimal string. 0 if the event was rejected.
          type: string
          pattern: "^[0-9]+$"
        status:
          type: integer
          minimum: 0
          maximum: 4294967295

    Account:
      type: object
      required:
        - id
        - debits_pending
        - debits_posted
        - credits_pending
        - credits_posted
        - user_data_128
        - user_data_64
        - user_data_32
        - ledger
        - code
        - flags
        - timestamp
      properties:
        id: { $ref: "#/components/schemas/Id" }
        debits_pending: { $ref: "#/components/schemas/U128" }
        debits_posted: { $ref: "#/components/schemas/U128" }
        credits_pending: { $ref: "#/components/schemas/U128" }
        credits_posted: { $ref: "#/components/schemas/U128" }
        user_data_128: { $ref: "#/components/schemas/U128" }
        user_data_64:
          type: string
          pattern: "^[0-9]+$"
        user_data_32:
          type: integer
        ledger:
          type: integer
        code:
          type: integer
        flags:
          type: integer
        timestamp:
          type: string
          pattern: "^[0-9]+$"
        name:
          description: Set only when this account was created with (or later given) a name.
          type: string
        currency:
          description: >-
            Set only when this account's (ledger, code) pair has a registered meaning -- see
            GET /codes.
          $ref: "#/components/schemas/CurrencyInfo"

    Transfer:
      type: object
      required:
        - id
        - debit_account_id
        - credit_account_id
        - amount
        - pending_id
        - user_data_128
        - user_data_64
        - user_data_32
        - timeout
        - ledger
        - code
        - flags
        - timestamp
      properties:
        id: { $ref: "#/components/schemas/Id" }
        debit_account_id: { $ref: "#/components/schemas/Id" }
        credit_account_id: { $ref: "#/components/schemas/Id" }
        amount: { $ref: "#/components/schemas/U128" }
        pending_id: { $ref: "#/components/schemas/Id" }
        user_data_128: { $ref: "#/components/schemas/U128" }
        user_data_64:
          type: string
          pattern: "^[0-9]+$"
        user_data_32:
          type: integer
        timeout:
          type: integer
        ledger:
          type: integer
        code:
          type: integer
        flags:
          type: integer
        timestamp:
          type: string
          pattern: "^[0-9]+$"
        currency:
          description: >-
            Set only when this transfer's (ledger, code) pair has a registered meaning -- see
            GET /codes.
          $ref: "#/components/schemas/CurrencyInfo"
