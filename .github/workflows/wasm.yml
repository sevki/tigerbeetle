name: "WASM Worker"
permissions: {}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # build.zig's release_history() shells out to `git tag --merged HEAD^ ...`
          # unconditionally on every `zig build` invocation; a shallow clone leaves no HEAD^ to
          # merge against. Matches release.yml/release_validate.yml's fetch-depth.
          fetch-depth: 2147483647

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: zig
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./zig/download.sh') }}
      - run: ./zig/download.sh

      - run: ./zig/zig build ci -- wasm
